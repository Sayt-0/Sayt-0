name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/grs.yml]

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      # Without the PAT the action falls back to GITHUB_TOKEN and silently drops private repositories.
      - name: Require the stats token
        env:
          GRS_TOKEN: ${{ secrets.GRS_TOKEN }}
        run: |
          if [ -z "$GRS_TOKEN" ]; then
            echo "::error::Secret GRS_TOKEN is missing"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=Sayt-0&count_private=true&show_icons=true&hide=stars&theme=radical
          path: cards/stats-dark.svg
          token: ${{ secrets.GRS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=Sayt-0&count_private=true&show_icons=true&hide=stars&theme=default
          path: cards/stats-light.svg
          token: ${{ secrets.GRS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=Sayt-0&exclude_repo=github-readme-stats*&layout=donut&langs_count=8&theme=radical
          path: cards/top-langs-dark.svg
          token: ${{ secrets.GRS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=Sayt-0&exclude_repo=github-readme-stats*&layout=donut&langs_count=8&theme=default
          path: cards/top-langs-light.svg
          token: ${{ secrets.GRS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update README cards"
          git push
